[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-marker-explorer-api"
version = "0.1.0"
description = "backend for the Geospatial marker explorer."
authors = [{ name = "Thomas Nguyen", email = "nguyen3lihn@gmail.com" }]

dependencies = [
  "sqlalchemy==2.0.46",        # ORM
  "sqlalchemy-utils==0.41.2",  # SQLAlchemy utility collection
  "asyncpg==0.30.0",           # async PostgreSQL driver
  "fastapi==0.119.0",          # web framework
  "pydantic==2.12.3",          # data validation & serialization
  "uvicorn[standard]==0.34.0", # ASGI server
  "python-multipart==0.0.32",  # File upload support
]

[tool.setuptools.packages.find]
where = ["source"]